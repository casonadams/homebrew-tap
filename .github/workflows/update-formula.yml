name: Update Formula

on:
  workflow_dispatch:
  repository_dispatch:
    types: [rho-release, ripwire-release, ripwire-rs-release]

permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  update-rho:
    name: "Update rho formula"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'rho-release'
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest rho release
        id: release
        run: |
          TAG="${{ github.event.client_payload.tag }}"
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            RELEASE_JSON=$(curl -sL https://api.github.com/repos/casonadams/rho/releases/latest)
            TAG=$(echo "$RELEASE_JSON" | jq -r .tag_name)
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Failed to fetch latest tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          curl -sL "https://github.com/casonadams/rho/releases/download/${TAG}/SHA256SUMS" -o SHA256SUMS

      - name: Generate formula
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"

          AARCH64_DARWIN_SHA=$(grep "rho-.*-aarch64-apple-darwin\.tar\.gz" SHA256SUMS | awk '{print $1}')
          X86_64_DARWIN_SHA=$(grep "rho-.*-x86_64-apple-darwin\.tar\.gz" SHA256SUMS | awk '{print $1}')
          AARCH64_LINUX_SHA=$(grep "rho-.*-aarch64-unknown-linux-gnu\.tar\.gz" SHA256SUMS | awk '{print $1}')
          X86_64_LINUX_SHA=$(grep "rho-.*-x86_64-unknown-linux-gnu\.tar\.gz" SHA256SUMS | awk '{print $1}')

          mkdir -p Formula
          cat << FORMULA | sed 's/^          //' > Formula/rho.rb
          class Rho < Formula
            desc "Minimal agentic coding CLI harness in Rust"
            homepage "https://github.com/casonadams/rho"
            version "${VERSION}"
            license any_of: ["MIT", "Apache-2.0"]

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/casonadams/rho/releases/download/${TAG}/rho-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${AARCH64_DARWIN_SHA}"
              else
                url "https://github.com/casonadams/rho/releases/download/${TAG}/rho-${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "${X86_64_DARWIN_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/casonadams/rho/releases/download/${TAG}/rho-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${AARCH64_LINUX_SHA}"
              else
                url "https://github.com/casonadams/rho/releases/download/${TAG}/rho-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${X86_64_LINUX_SHA}"
              end
            end

            def install
              bin.install "rho"
            end

            test do
              assert_match "rho #{version}", shell_output("#{bin}/rho --version")
            end
          end
          FORMULA
          rm -f SHA256SUMS

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/rho.rb
          if git diff --staged --quiet; then
            echo "Formula is already up to date"
          else
            git commit -m "chore: update rho formula to ${{ steps.release.outputs.tag }}"
            git push
          fi

  update-ripwire:
    name: "Update ripwire-rs formula"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'ripwire-release' || github.event.action == 'ripwire-rs-release'
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest ripwire-rs release
        id: release
        run: |
          TAG="${{ github.event.client_payload.tag }}"
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            RELEASE_JSON=$(curl -sL https://api.github.com/repos/casonadams/ripwire-rs/releases/latest)
            TAG=$(echo "$RELEASE_JSON" | jq -r .tag_name)
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Failed to fetch latest tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          curl -sL "https://github.com/casonadams/ripwire-rs/releases/download/${TAG}/SHA256SUMS" -o SHA256SUMS

      - name: Generate formula
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"

          AARCH64_DARWIN_SHA=$(grep -E "(ripwire-rs|ripwire)-.*-aarch64-apple-darwin\.tar\.gz" SHA256SUMS | awk '{print $1}')
          X86_64_DARWIN_SHA=$(grep -E "(ripwire-rs|ripwire)-.*-x86_64-apple-darwin\.tar\.gz" SHA256SUMS | awk '{print $1}')
          AARCH64_LINUX_SHA=$(grep -E "(ripwire-rs|ripwire)-.*-aarch64-unknown-linux-gnu\.tar\.gz" SHA256SUMS | awk '{print $1}')
          X86_64_LINUX_SHA=$(grep -E "(ripwire-rs|ripwire)-.*-x86_64-unknown-linux-gnu\.tar\.gz" SHA256SUMS | awk '{print $1}')

          mkdir -p Formula
          cat << FORMULA | sed 's/^          //' > Formula/ripwire-rs.rb
          class RipwireRs < Formula
            desc "High-throughput agent context router and deterministic static analysis engine"
            homepage "https://github.com/casonadams/ripwire-rs"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/casonadams/ripwire-rs/releases/download/${TAG}/ripwire-rs-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${AARCH64_DARWIN_SHA}"
              else
                url "https://github.com/casonadams/ripwire-rs/releases/download/${TAG}/ripwire-rs-${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "${X86_64_DARWIN_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/casonadams/ripwire-rs/releases/download/${TAG}/ripwire-rs-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${AARCH64_LINUX_SHA}"
              else
                url "https://github.com/casonadams/ripwire-rs/releases/download/${TAG}/ripwire-rs-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${X86_64_LINUX_SHA}"
              end
            end

            def install
              bin.install "ripwire-rs"
              man1.install "ripwire-rs.1" if File.exist?("ripwire-rs.1")
            end

            test do
              assert_match "ripwire-rs #{version}", shell_output("#{bin}/ripwire-rs --version")
            end
          end
          FORMULA
          rm -f SHA256SUMS

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ripwire-rs.rb
          if git diff --staged --quiet; then
            echo "Formula is already up to date"
          else
            git commit -m "chore: update ripwire-rs formula to ${{ steps.release.outputs.tag }}"
            git push
          fi

  publish-linux-repos:
    name: "Publish APT & RPM Repositories to GitHub Pages"
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Install packaging & repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils rpm createrepo-c jq

      - name: Build APT and RPM repositories for ripwire-rs and rho
        run: |
          set -euo pipefail
          SITE="$(pwd)/_site"
          mkdir -p "$SITE/apt/pool/main" \
                   "$SITE/apt/dists/stable/main/binary-amd64" \
                   "$SITE/apt/dists/stable/main/binary-arm64" \
                   "$SITE/rpm"

          package_repo() {
            local pkg="$1"
            local desc="$2"
            local license="$3"
            local rel_json
            rel_json="$(curl -sfL "https://api.github.com/repos/casonadams/${pkg}/releases/latest")" || return 0
            local tag version
            tag="$(echo "$rel_json" | jq -r .tag_name)"
            [ -n "$tag" ] && [ "$tag" != "null" ] || return 0
            version="${tag#v}"

            for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
              local deb_arch rpm_arch
              if [[ "$target" == x86_64-* ]]; then
                deb_arch="amd64"; rpm_arch="x86_64"
              else
                deb_arch="arm64"; rpm_arch="aarch64"
              fi

              local deb_file="${pkg}_${version}_${deb_arch}.deb"
              local rpm_file="${pkg}-${version}-1.${rpm_arch}.rpm"
              local base_url="https://github.com/casonadams/${pkg}/releases/download/${tag}"

              if curl -sfL "${base_url}/${deb_file}" -o "$SITE/apt/pool/main/${deb_file}" && \
                 curl -sfL "${base_url}/${rpm_file}" -o "$SITE/rpm/${rpm_file}"; then
                continue
              fi

              local tar_url="${base_url}/${pkg}-${version}-${target}.tar.gz"
              local work
              work="$(mktemp -d)"
              if ! curl -sfL "$tar_url" -o "$work/pkg.tar.gz"; then
                rm -rf "$work"
                continue
              fi
              mkdir -p "$work/extracted"
              tar xzf "$work/pkg.tar.gz" -C "$work/extracted"

              # Synthesize .deb
              local deb_root="$work/deb"
              mkdir -p "$deb_root/DEBIAN" "$deb_root/usr/bin"
              install -m 755 "$work/extracted/${pkg}" "$deb_root/usr/bin/${pkg}"
              if [ -f "$work/extracted/${pkg}.1" ]; then
                mkdir -p "$deb_root/usr/share/man/man1"
                gzip -9n -c "$work/extracted/${pkg}.1" > "$deb_root/usr/share/man/man1/${pkg}.1.gz"
              fi
              cat > "$deb_root/DEBIAN/control" <<EOF
          Package: ${pkg}
          Version: ${version}
          Section: devel
          Priority: optional
          Architecture: ${deb_arch}
          Maintainer: Cason Adams <casonadams@users.noreply.github.com>
          Homepage: https://github.com/casonadams/${pkg}
          Description: ${desc}
          EOF
              sed -i 's/^          //' "$deb_root/DEBIAN/control"
              dpkg-deb --build --root-owner-group "$deb_root" "$SITE/apt/pool/main/${deb_file}"

              # Synthesize .rpm
              local rpm_top="$work/rpm"
              mkdir -p "$rpm_top/BUILD" "$rpm_top/RPMS" "$rpm_top/SOURCES" "$rpm_top/SPECS" "$rpm_top/SRPMS"
              cat > "$rpm_top/SPECS/${pkg}.spec" <<EOF
          %define _build_id_links none
          Name: ${pkg}
          Version: ${version}
          Release: 1
          Summary: ${desc}
          License: ${license}
          URL: https://github.com/casonadams/${pkg}
          AutoReqProv: no
          %description
          ${desc}
          %install
          mkdir -p %{buildroot}/usr/bin
          install -m 755 "$work/extracted/${pkg}" %{buildroot}/usr/bin/${pkg}
          if [ -f "$work/extracted/${pkg}.1" ]; then
            mkdir -p %{buildroot}/usr/share/man/man1
            gzip -9n -c "$work/extracted/${pkg}.1" > %{buildroot}/usr/share/man/man1/${pkg}.1.gz
          fi
          %files
          /usr/bin/${pkg}
          EOF
              sed -i 's/^          //' "$rpm_top/SPECS/${pkg}.spec"
              if [ -f "$work/extracted/${pkg}.1" ]; then
                echo "/usr/share/man/man1/${pkg}.1.gz" >> "$rpm_top/SPECS/${pkg}.spec"
              fi
              rpmbuild -bb --target "$rpm_arch" --define "_topdir $rpm_top" "$rpm_top/SPECS/${pkg}.spec"
              cp "$rpm_top/RPMS/$rpm_arch/"*.rpm "$SITE/rpm/${rpm_file}"
              rm -rf "$work"
            done
          }

          package_repo "ripwire-rs" "High-throughput agent context router and deterministic static analysis engine" "Apache-2.0"
          package_repo "rho" "Minimal agentic coding CLI harness in Rust" "MIT OR Apache-2.0"

          # Generate APT metadata
          (
            cd "$SITE/apt"
            dpkg-scanpackages --arch amd64 pool/ > dists/stable/main/binary-amd64/Packages
            gzip -9n -c dists/stable/main/binary-amd64/Packages > dists/stable/main/binary-amd64/Packages.gz
            dpkg-scanpackages --arch arm64 pool/ > dists/stable/main/binary-arm64/Packages
            gzip -9n -c dists/stable/main/binary-arm64/Packages > dists/stable/main/binary-arm64/Packages.gz
            cd dists/stable
            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin="casonadams" \
              -o APT::FTPArchive::Release::Label="casonadams" \
              -o APT::FTPArchive::Release::Suite="stable" \
              -o APT::FTPArchive::Release::Codename="stable" \
              -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
              -o APT::FTPArchive::Release::Components="main" \
              release . > Release
          )

          # Generate RPM metadata & .repo file
          createrepo_c "$SITE/rpm"
          cat > "$SITE/rpm/casonadams.repo" <<'EOF'
          [casonadams]
          name=Cason Adams Packages (ripwire-rs, rho)
          baseurl=https://casonadams.github.io/homebrew-tap/rpm
          enabled=1
          gpgcheck=0
          EOF
          sed -i 's/^          //' "$SITE/rpm/casonadams.repo"

          cat > "$SITE/index.html" <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="utf-8"><title>casonadams Package Repository</title></head>
          <body>
            <h1>casonadams Package Repository (Homebrew, APT, RPM)</h1>
            <h2>Homebrew (macOS &amp; Linux)</h2>
            <pre>brew install casonadams/tap/ripwire-rs casonadams/tap/rho</pre>
            <h2>APT (Ubuntu &amp; Debian)</h2>
            <pre>echo "deb [trusted=yes] https://casonadams.github.io/homebrew-tap/apt stable main" | sudo tee /etc/apt/sources.list.d/casonadams.list
          sudo apt update &amp;&amp; sudo apt install ripwire-rs rho</pre>
            <h2>DNF / RPM (Fedora, RHEL &amp; CentOS)</h2>
            <pre>sudo dnf config-manager --add-repo https://casonadams.github.io/homebrew-tap/rpm/casonadams.repo
          sudo dnf install ripwire-rs rho</pre>
          </body>
          </html>
          EOF
          sed -i 's/^          //' "$SITE/index.html"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
